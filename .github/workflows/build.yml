name: Windows Exe Derleme

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python mediapipe==0.10.14 pillow numpy pyinstaller

      - name: Exe Olustur
        run: pyinstaller --noconsole --onefile --collect-all mediapipe --collect-data mediapipe --collect-binaries mediapipe --collect-submodules mediapipe --hidden-import=mediapipe.python.solutions --hidden-import=mediapipe.python.solutions.hands --hidden-import=mediapipe.python.solutions.drawing_utils --hidden-import=mediapipe.python._framework_bindings --add-data "selamlama.gif;." main.py

      - name: Exe Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: SelamlamaProgrami-Windows
          path: dist/*.exe
